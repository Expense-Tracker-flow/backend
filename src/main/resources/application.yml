spring:
  application:
    name: flow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flow_db}
    username: ${DB_USERNAME:flow_user}
    password: ${DB_PASSWORD:flow_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:uksayoojjayarajan@gmail.com}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${SPRING_MAIL_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:10000}
          ssl:
            trust: ${SPRING_MAIL_SSL_TRUST:${SMTP_HOST:smtp.gmail.com}}

management:
  health:
    mail:
      enabled: false

server:
  port: 8080
  servlet:
    context-path: /

flow:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000 # 24 hours (86400000 ms)
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,https://frontend-3kpismkvr-sayooj-uks-projects.vercel.app,https://frontend-lilac-iota-37.vercel.app,https://frontend.uksayoojjayarajan.workers.dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.flow: DEBUG
    org.springframework.security: INFO
